# Production: the bot and the web panel plus Postgres, Redis, Lavalink and yt-cipher. See docs/DEPLOYMENT.md.
#   bun run prod:up
# Nothing is published except the bot's health endpoint on 127.0.0.1; the panel publishes no port at all. The services reach each other by
# name, so the bot's connection URLs are built here, not in the env file. Two networks: `data` (Postgres,
# Redis) has no route out, `music` (Lavalink, yt-cipher) does; the bot is on both and reaches Discord
# through `music`. A third, `panel`, joins the web panel and the reverse proxy and has no route out either
# (ADR 9).
name: dzajcarz-prod

# Docker's default json-file log never rotates; the bot logs a JSON line per event.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  bot:
    # The deployed version is the commit checked out next to this file. `bun run prod:*` sets BOT_REVISION
    # to it, so `docker ps` and the image label show which commit runs.
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        REVISION: ${BOT_REVISION:?run bun run prod:up, or set BOT_REVISION to git rev-parse --short HEAD}
    image: dzajcarz-bot:${BOT_REVISION:?run bun run prod:up, or set BOT_REVISION to git rev-parse --short HEAD}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not healthy: the bot starts without the node and reconnects, music commands say it is unavailable.
      lavalink:
        condition: service_started
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      # No DISCORD_DEV_TOKEN / DISCORD_DEV_CLIENT_ID either: production must never run as the test bot.
      # No DISCORD_DEV_GUILD_ID on purpose: the startup deploy then registers the commands globally,
      # and only when they differ from what Discord has.
      COMMANDS_AUTO_DEPLOY: "true"
      DATABASE_URL: postgres://dzajcarz:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/dzajcarz
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      LAVALINK_URL: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      BOT_PREFIX: ${BOT_PREFIX:-!}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RIOT_VALORANT_API_KEY: ${RIOT_VALORANT_API_KEY:-}
      RIOT_LOL_API_KEY: ${RIOT_LOL_API_KEY:-}
      SCHEDULED_SONG_CRON: ${SCHEDULED_SONG_CRON:-0 9,21 * * *}
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-Europe/Warsaw}
    networks: [data, music]
    ports:
      - "127.0.0.1:${HEALTH_PUBLISH_PORT:-8080}:8080"
    # The binary writes nothing outside /tmp.
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Time for the shutdown: panels removed, voice left, connections closed.
    stop_grace_period: 30s
    logging: *logging

  # The web panel (ADR 9): no login of its own, so it only ever sits behind the reverse proxy with Authentik,
  # which joins the `panel` network from its own compose project. Not published on any host port. It does
  # not wait for the bot: the panel has to work, and say so, while the bot is down.
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        REVISION: ${BOT_REVISION:?run bun run prod:up, or set BOT_REVISION to git rev-parse --short HEAD}
    image: dzajcarz-web:${BOT_REVISION:?run bun run prod:up, or set BOT_REVISION to git rev-parse --short HEAD}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-db-role:
        condition: service_completed_successfully
    environment:
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?set WEB_PUBLIC_ORIGIN in .env to the public URL of the panel}
      # Its own logins, never the bot's: the dzajcarz_web role and the web Redis user (ADR 9).
      WEB_DATABASE_URL: postgres://dzajcarz_web:${WEB_POSTGRES_PASSWORD:?set WEB_POSTGRES_PASSWORD in .env}@postgres:5432/dzajcarz
      WEB_REDIS_URL: redis://web:${WEB_REDIS_PASSWORD:?set WEB_REDIS_PASSWORD in .env}@redis:6379/0
      BOT_REQUEST_TIMEOUT_MS: ${BOT_REQUEST_TIMEOUT_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [data, panel]
    # No `ports:` on purpose.
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    logging: *logging

  postgres:
    # Images pinned by the digest of their multi-arch index; Dependabot refreshes them.
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_USER: dzajcarz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dzajcarz
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzajcarz -d dzajcarz -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot step on every start: gives the web panel's database role (ADR 9) its login and the password
  # from WEB_POSTGRES_PASSWORD. The bot's migrations grant what the role may touch.
  web-db-role:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    user: "70:70"
    entrypoint:
      ["psql", "-h", "postgres", "-U", "dzajcarz", "-d", "dzajcarz", "-q", "-f", "/web-role.sql"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WEB_POSTGRES_PASSWORD: ${WEB_POSTGRES_PASSWORD:?set WEB_POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres/web-role.sql:/web-role.sql:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Caches, cooldowns and other state that may be lost (ADR 0003).
  redis:
    image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    networks: [data]
    # The password goes into a config file on a tmpfs, not onto the command line, where `ps` would show
    # it (it is still in the container's environment for redis-cli). The image's entrypoint then starts redis-server as the redis user.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\nuser web on >%s %s\n' "$$REDISCLI_AUTH" "$$WEB_REDIS_PASSWORD"
        "$$(grep -v '^#' /web-user.acl | tr '\n' ' ')" > /tmp/redis.conf &&
        chown redis:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
        --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    environment:
      # Read by the command above and by redis-cli in the health check.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # The web panel's own user, limited to its pub/sub channels by infra/redis/web-user.acl (ADR 9).
      WEB_REDIS_PASSWORD: ${WEB_REDIS_PASSWORD:?set WEB_REDIS_PASSWORD in .env}
    tmpfs:
      - /tmp:mode=0755,size=1m
    volumes:
      - redis-data:/data
      - ./redis/web-user.acl:/web-user.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # Music is always on in production (no profile): the scheduled songs need it too.
  # One-shot step: downloads the YouTube plugin, checks it against lavalink/youtube-plugin.sha256 and stops
  # the start on a mismatch, so Lavalink never fetches the jar itself. Lavalink mounts the volume
  # read-only. Needs the music network to reach maven.lavalink.dev.
  lavalink-plugins-init:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine@sha256:96be2be7ee50d35a9bd42c8c7b99e2a4b741f09123066c1ebb9e014dd7db204d
    user: "0"
    entrypoint: ["sh", "/fetch-plugin.sh"]
    networks: [music]
    read_only: true
    tmpfs:
      - /tmp:mode=0700,size=1m
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins
      - ./lavalink/fetch-plugin.sh:/fetch-plugin.sh:ro
      - ./lavalink/youtube-plugin.sha256:/youtube-plugin.sha256:ro
    logging: *logging

  # Deciphers YouTube stream signatures for the youtube-plugin (ADR 0004). Pinned by digest: upstream only
  # publishes a moving `master` tag. Same hardening as in the development compose.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    restart: unless-stopped
    networks: [music]
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /home/nonroot/.cache:uid=65532,gid=65532,mode=0700,size=64m
      - /tmp:uid=65532,gid=65532,mode=0700,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS
    logging: *logging

  # Loads the YouTube plugin that lavalink-plugins-init verified (ADR 0004).
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine@sha256:96be2be7ee50d35a9bd42c8c7b99e2a4b741f09123066c1ebb9e014dd7db204d
    restart: unless-stopped
    networks: [music]
    # Runs as the image's lavalink user (uid 322). Only the plugins volume and /tmp are writable
    # (Lavalink logs to stdout only).
    read_only: true
    tmpfs:
      # exec: Lavaplayer unpacks its native audio libraries here and loads them.
      - /tmp:uid=322,gid=322,mode=0700,size=64m,exec
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      lavalink-plugins-init:
        condition: service_completed_successfully
      yt-cipher:
        condition: service_started
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      _JAVA_OPTIONS: -Xmx512M
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # The scheduled songs (ADR 0004), played by a fixed name, never by member input.
      - ./lavalink/music:/opt/Lavalink/music:ro
      # Read-only: the init step owns what is in here.
      - lavalink-plugins:/opt/Lavalink/plugins:ro
    logging: *logging

networks:
  data:
    internal: true
  music:
  # Only the web panel and the reverse proxy join it: whatever is on this network reaches the panel without
  # Authentik. Internal, so the panel has no route out at all; the proxy's own compose project still attaches
  # to it (`external: true`) and reaches the internet through its other networks.
  panel:
    name: dzajcarz-panel
    internal: true

volumes:
  postgres-data:
  redis-data:
  lavalink-plugins:
