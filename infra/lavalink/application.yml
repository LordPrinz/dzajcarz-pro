# Local Lavalink node. The password comes from LAVALINK_SERVER_PASSWORD (docker-compose, .env).
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube moved out of Lavaplayer into this plugin; the built-in source is disabled below.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      # Off: any user could make the node fetch internal URLs (cloud metadata, Redis).
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients: ["MUSIC", "WEB", "ANDROID_VR", "TVHTML5EMBEDDED"]

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
