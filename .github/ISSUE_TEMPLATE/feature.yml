name: Feature
description: A piece of functionality to build
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, music, moderation, party, welcome, fun, infra, docs]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible once this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and events
      description: Slash / prefix commands, options, permissions and Discord events involved.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that define "done".
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, open questions.
