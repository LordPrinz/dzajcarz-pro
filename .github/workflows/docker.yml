name: Docker

# Builds the production image (never pushed) when something that goes into it changes.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - bunfig.toml
      - apps/**
      - packages/**
      - modules/**
      - infra/docker-compose.prod.yml
      - .github/workflows/docker.yml
  push:
    branches: [v5]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - bunfig.toml
      - apps/**
      - packages/**
      - modules/**
      - infra/docker-compose.prod.yml
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t dzajcarz-bot:ci .
      # The binary has to start on the runtime image: with nothing listening, the health check exits 1.
      - name: Binary runs
        run: |
          set +e
          docker run --rm dzajcarz-bot:ci healthcheck
          status=$?
          set -e
          test "$status" -eq 1
      - name: Production compose is valid
        run: docker compose -f infra/docker-compose.prod.yml config --quiet
        env:
          DISCORD_TOKEN: ci
          DISCORD_CLIENT_ID: "0"
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
          LAVALINK_PASSWORD: ci
