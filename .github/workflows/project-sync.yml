name: Project sync

# Moves the linked issue across the project board:
#   branch DZAJ-<n>-… created → In Progress, PR opened → QA, PR converted to draft → In Progress.
# "Done" is handled by the board's built-in workflows when the PR merges into main; the sync never touches a closed issue.
on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    if: vars.PROJECT_NUMBER != '' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The script runs with PROJECTS_TOKEN, so it comes from the default branch, never from the
      # branch that triggered the event (a pushed branch could otherwise read the token).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun scripts/gh/sync-project.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
